<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Toolkit - User Directory</title>
  <script src="users.js" defer></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
      background-color: #f8fafc;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 18px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #0369a1;
    }
    input[type="text"] {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      flex: 1;
      min-width: 200px;
    }
    #status {
      font-weight: 500;
      color: #475569;
      margin-bottom: 16px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    li.user-item {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 6px;
      border-left: 4px solid #0284c7;
    }
    li.user-item h3 {
      margin: 0 0 4px 0;
      color: #0f172a;
    }
    li.user-item p {
      margin: 2px 0;
      color: #475569;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>User Directory Explorer</h1>
  </header>

  <main>
    <section class="card">
      <div class="controls">
        <button id="load-users" type="button">Load Users</button>
        <div>
          <label for="filter-input">Filter by name: </label>
          <input type="text" id="filter-input" placeholder="Type a name to search...">
        </div>
      </div>

      <p id="status">Click "Load Users" to fetch data from the API.</p>

      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
