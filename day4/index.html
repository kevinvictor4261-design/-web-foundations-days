<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Toolkit - Draft Pad</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Notes Toolkit</h1>
    <button id="theme-toggle" type="button">Dark mode</button>
  </header>

  <main>
    <section class="editor-card">
      <label for="note-text">Type your note below:</label>
      <textarea id="note-text" rows="8" placeholder="Start typing..."></textarea>

      <div class="counter-container">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="button-container">
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Notes Toolkit. All rights reserved.</p>
  </footer>
</body>
</html>
